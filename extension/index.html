<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap");

      button {
        color: #fff;
        background-color: #2b2c2f;
        border-radius: 4px;
        border-width: 0px;
        padding: 5px 10px 5px 10px;
      }

      input[type="text"] {
        border-radius: 5px;
        padding: 10px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        border: 1px solid #ccc;
        font-size: 16px;
        color: #333;
      }

      button:hover {
        background-color: #3a3b40;
      }

      body {
        font-family: "Inter", serif;
      }
    </style>
  </head>
  <body style="background-color: #e4e4e6">
    <div class="container mb-3 mt-3" style="width: 400px">
      <div style="padding: 10px">
        <h2>ADHDNotes Extension</h2>
        <p id="caption" style="margin-top: 5px">
          Turn your text selections into text files.
        </p>
        <table id="sitelist" style="width: 100%; margin-bottom: 8px"></table>
        <div id="save">
          <button
            class="mb-1"
            id="submit"
            style="
              border-radius: 100px;
              width: 50px;
              height: 50px;
              margin-top: 8px;
            "
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              style="width: 80%; height: 80%"
            >
              <path
                fill-rule="evenodd"
                d="M12 3.75a.75.75 0 0 1 .75.75v6.75h6.75a.75.75 0 0 1 0 1.5h-6.75v6.75a.75.75 0 0 1-1.5 0v-6.75H4.5a.75.75 0 0 1 0-1.5h6.75V4.5a.75.75 0 0 1 .75-.75Z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
          <button
            id="cancel"
            style="
              border-radius: 100px;
              width: 50px;
              height: 50px;
              margin-top: 8px;
            "
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              style="width: 80%; height: 80%"
            >
              <path
                fill-rule="evenodd"
                d="M5.47 5.47a.75.75 0 0 1 1.06 0L12 10.94l5.47-5.47a.75.75 0 1 1 1.06 1.06L13.06 12l5.47 5.47a.75.75 0 1 1-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 0 1-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 0 1 0-1.06Z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
        </div>
        <button
          id="start_recording"
          style="border-radius: 100px; width: 50px; height: 50px"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            style="width: 80%; height: 80%"
          >
            <path
              d="M4.5 4.5a3 3 0 0 0-3 3v9a3 3 0 0 0 3 3h8.25a3 3 0 0 0 3-3v-9a3 3 0 0 0-3-3H4.5ZM19.94 18.75l-2.69-2.69V7.94l2.69-2.69c.944-.945 2.56-.276 2.56 1.06v11.38c0 1.336-1.616 2.005-2.56 1.06Z"
            />
          </svg>
        </button>
        <button
          id="stop_recording"
          style="border-radius: 100px; width: 50px; height: 50px"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            style="width: 80%; height: 80%"
          >
            <path
              fill-rule="evenodd"
              d="M4.5 7.5a3 3 0 0 1 3-3h9a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-9a3 3 0 0 1-3-3v-9Z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
      </div>
    </div>
    <script src="extension.js"></script>
  </body>
</html>
